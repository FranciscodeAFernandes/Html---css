<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table {
            border-collapse: collapse;
            width: 400px;
        }

        td, th {
            border: 1px solid black;
        }

        .cnome {
            background-color: rgb(248, 144, 248);
        }
    </style>
</head>
<body>
    <h1>Exercício de tabela</h1>

    

    <table>
        
        <colgroup>
            <col class="cnome">
            <col class="sexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>

        <tr>
            <th class="col">Nome</th>
            <th class="col">Sexo</th>
            <th class="col">Idade</th>
            <th class="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>Cláudio</td>
            <td>M</td>
            <td>28</td>
            <td>Programador</td>
        </tr>

        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>42</td>
            <td>Professor</td>
        </tr>

        <tr>
            <td>Hélio</td>
            <td>M</td>
            <td>19</td>
            <td>Vendedor</td>
        </tr>

        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>38</td>
            <td>Médica</td>
        </tr>
        
        <tr>
            <td>Otávio</td>
            <td>M</td>
            <td>22</td>
            <td>Nutricionista</td>
        </tr>
    </table>
    <a href="tabela001.html">Página 1</a>
</body>
</html>
