<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            border-collapse: collapse;
            width: 500px;
        }

        td, th {
            border: 1px solid black;
            padding: 5px;
        }

        td {
            text-align: left;
        }

        thead > tr {
            background-color: lightgray;
        }

        th.media {
            background-color: lightgray;
        }

        td.num {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tabela de notas</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>

            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>

        </thead>

        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td class="num">10.0</td>
                <td class="num">10.0</td>
                <td class="num">10.0</td>
            </tr>

            <tr>
                <td>Física</td>
                <td class="num">8.9</td>
                <td class="num">9.0</td>
                <td class="num">8.9</td>
            </tr>

            <tr>
                <td>Química</td>
                <td class="num">-</td>
                <td class="num">-</td>
                <td class="num">-</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td class="num">7.0</td>
                <td class="num">6.5</td>
                <td class="num">6.7</td>
            </tr>

            <tr>
                <th colspan="5" class="media">Média de exatas</th>
            </tr>

            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td class="num">8.5</td>
                <td class="num">8.2</td>
                <td class="num">8.3</td>
            </tr>

            <tr>
                <td>geografia</td>
                <td class="num">9.7</td>
                <td class="num">10.0</td>
                <td class="num">8.3</td>
            </tr>

            <tr>
                <th colspan="5" class="media">Média Humanas</th>
            </tr>
        </tbody>

    </table>
    <a href="tabela001.html">Página 1</a>
    <a href="tabela007.html"> Página 7</a>
</body>
</html>
